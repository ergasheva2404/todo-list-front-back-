<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Todo List</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <div class="todo-card">
    <div class="header">
      <div class="title-group">
        <div class="logo-icon">📋</div>
        <h1>My Todo List</h1>
      </div>
    </div>

    <div class="add-box">
      <input id ="inputName" type="text" placeholder="Add new..." />
      <button onClick="addNewTask()" id="addBtn">+ Add</button>
    </div>

    <div class="controls-row">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search..." />
        <i class="fa-solid fa-xmark clear-search" id="clearSearchBtn"></i>
      </div>
      <select id="filterSelect">
        <option value="all">All</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div id="list">
      <ul id="todoUl">
      </ul>
    </div>
    <div class="total-count">Total: <span id="totalCount">0</span></div>


    <div class="action-buttons">
      <button id="toggleAllBtn" class="btn-action">Set All Completed</button>
      <button onclick="clearAllCompleted()" id="clearCompletedBtn" class="btn-action">Clear All Completed</button>
      <button id="clearAllBtn" class="btn-action">Clear All</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
